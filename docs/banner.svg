<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="spaceflight-news-kotlin: Kotlin client for the Spaceflight News API with a Compose news reader" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1F"/>
      <stop offset="0.6" stop-color="#121A45"/>
      <stop offset="1" stop-color="#22307A"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#FFB27A"/>
      <stop offset="0.55" stop-color="#E8590C"/>
      <stop offset="1" stop-color="#7A2A06"/>
    </radialGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A4BC8"/>
      <stop offset="1" stop-color="#0C1645"/>
    </linearGradient>
    <linearGradient id="thumbA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E5B"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="thumbB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7DA2FF"/>
      <stop offset="1" stop-color="#2A4BC8"/>
    </linearGradient>
    <linearGradient id="thumbC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8DE1D0"/>
      <stop offset="1" stop-color="#1F7A6B"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.3" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>

  <!-- Stars -->
  <g fill="#FFFFFF">
    <circle cx="60" cy="50" r="1.6" opacity="0.8"/><circle cx="210" cy="90" r="1.2" opacity="0.6"/>
    <circle cx="380" cy="40" r="1.8" opacity="0.7"/><circle cx="520" cy="110" r="1.1" opacity="0.5"/>
    <circle cx="640" cy="60" r="1.5" opacity="0.8"/><circle cx="700" cy="480" r="1.3" opacity="0.6"/>
    <circle cx="560" cy="520" r="1.7" opacity="0.7"/><circle cx="120" cy="500" r="1.2" opacity="0.5"/>
    <circle cx="1240" cy="40" r="1.6" opacity="0.8"/><circle cx="1220" cy="300" r="1.1" opacity="0.6"/>
    <circle cx="1180" cy="520" r="1.5" opacity="0.7"/><circle cx="760" cy="200" r="1.2" opacity="0.6"/>
    <circle cx="30" cy="300" r="1.4" opacity="0.6"/><circle cx="450" cy="470" r="1" opacity="0.5"/>
  </g>

  <!-- Planet with orbit -->
  <circle cx="1196" cy="452" r="46" fill="url(#planet)"/>
  <ellipse cx="1196" cy="452" rx="74" ry="16" fill="none" stroke="#FFD2B0" stroke-opacity="0.55" stroke-width="3" transform="rotate(-18 1196 452)"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#FF9A5C" font-size="22" font-weight="700" letter-spacing="3">KOTLIN · SPACEFLIGHT NEWS API V4</text>
    <text x="80" y="218" fill="#FFFFFF" font-size="50" font-weight="800">spaceflight-news-kotlin</text>
    <text x="80" y="270" fill="#C9D3FF" font-size="25">A coroutine client for spaceflight news, with typed</text>
    <text x="80" y="304" fill="#C9D3FF" font-size="25">launches, events and paging, and a Compose reader.</text>
    <g font-size="16" font-weight="600" fill="#FFFFFF">
      <rect x="80" y="348" width="104" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.13"/>
      <text x="132" y="373" text-anchor="middle">Articles</text>
      <rect x="196" y="348" width="86" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.13"/>
      <text x="239" y="373" text-anchor="middle">Blogs</text>
      <rect x="294" y="348" width="100" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.13"/>
      <text x="344" y="373" text-anchor="middle">Reports</text>
      <rect x="406" y="348" width="192" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.13"/>
      <text x="502" y="373" text-anchor="middle">Launches + events</text>
      <rect x="80" y="400" width="124" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.13"/>
      <text x="142" y="425" text-anchor="middle">Coroutines</text>
      <rect x="216" y="400" width="164" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.13"/>
      <text x="298" y="425" text-anchor="middle">Paging via next</text>
      <rect x="392" y="400" width="172" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.13"/>
      <text x="478" y="425" text-anchor="middle">Phone + tablet</text>
    </g>
  </g>

  <!-- Phone with an abstract news feed -->
  <g transform="translate(200 -19.5) scale(0.85)">
  <g filter="url(#shadow)">
    <rect x="800" y="70" width="270" height="540" rx="40" fill="#0B0F24" stroke="#3A4A9A" stroke-width="3"/>
  </g>
  <rect x="814" y="84" width="242" height="520" rx="30" fill="#F8F8FC"/>
  <rect x="834" y="110" width="132" height="14" rx="7" fill="#1A1B21"/>
  <rect x="834" y="138" width="202" height="30" rx="15" fill="#E6E7F2"/>
  <g>
    <rect x="834" y="180" width="202" height="26" rx="13" fill="#FFFFFF" stroke="#C6C6D0"/>
    <rect x="834" y="180" width="68" height="26" rx="13" fill="#DDE1FF"/>
  </g>
  <rect x="834" y="216" width="56" height="20" rx="10" fill="#2A4BC8"/>
  <rect x="898" y="216" width="70" height="20" rx="10" fill="#E6E7F2"/>
  <rect x="976" y="216" width="60" height="20" rx="10" fill="#E6E7F2"/>
  <!-- Hero card -->
  <rect x="834" y="246" width="202" height="150" rx="18" fill="url(#hero)"/>
  <circle cx="980" cy="290" r="26" fill="url(#planet)"/>
  <path d="M870 340 l18 -44 l18 44 z" fill="#FFFFFF" opacity="0.9"/>
  <rect x="834" y="246" width="202" height="150" rx="18" fill="url(#shade)"/>
  <rect x="848" y="338" width="54" height="14" rx="7" fill="#E8590C"/>
  <rect x="848" y="358" width="160" height="10" rx="5" fill="#FFFFFF"/>
  <rect x="848" y="374" width="110" height="10" rx="5" fill="#FFFFFF" opacity="0.8"/>
  <!-- Rows -->
  <g>
    <rect x="834" y="412" width="60" height="8" rx="4" fill="#2A4BC8"/>
    <rect x="834" y="426" width="120" height="10" rx="5" fill="#1A1B21"/>
    <rect x="834" y="442" width="96" height="10" rx="5" fill="#1A1B21" opacity="0.7"/>
    <rect x="970" y="410" width="66" height="48" rx="10" fill="url(#thumbA)"/>
    <rect x="834" y="476" width="70" height="8" rx="4" fill="#2A4BC8"/>
    <rect x="834" y="490" width="126" height="10" rx="5" fill="#1A1B21"/>
    <rect x="834" y="506" width="84" height="10" rx="5" fill="#1A1B21" opacity="0.7"/>
    <rect x="970" y="474" width="66" height="48" rx="10" fill="url(#thumbB)"/>
    <rect x="834" y="540" width="50" height="8" rx="4" fill="#2A4BC8"/>
    <rect x="834" y="554" width="118" height="10" rx="5" fill="#1A1B21"/>
    <rect x="970" y="538" width="66" height="48" rx="10" fill="url(#thumbC)"/>
  </g>

  </g>

  <!-- Rocket trail -->
  <g transform="translate(1196 150) rotate(30)">
    <path d="M0 -46 C14 -30 16 -6 12 20 L-12 20 C-16 -6 -14 -30 0 -46 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="-14" r="6" fill="#2A4BC8"/>
    <path d="M-12 8 L-24 28 L-12 22 Z" fill="#E8590C"/>
    <path d="M12 8 L24 28 L12 22 Z" fill="#E8590C"/>
    <path d="M-8 22 Q0 60 8 22 Z" fill="#FFB27A"/>
  </g>
  <path d="M1180 205 Q1160 260 1130 290" fill="none" stroke="#FFB27A" stroke-opacity="0.35" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
</svg>
